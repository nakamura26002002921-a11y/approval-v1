<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/style.css">
    <title>Server Approval</title>
</head>
<body>
    <main class="container">
        <h1>Server Approval</h1>

        <section class="card">
            <h2>サーバーID</h2>
            <input id="serverId" type="text" placeholder="サーバーIDを入力">
            <button onclick="accessServer()">アクセス</button>
        </section>

        <section id="serverSection" class="card hidden">
            <h2>サーバー状態</h2>

            <div id="status" class="status">---</div>

            <button class="approve" onclick="approveServer()">承認</button>
        </section>

        <section id="message" class="message"></section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
